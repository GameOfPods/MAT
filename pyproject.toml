[project]
name = "MAT"
description = "Media Analytics Toolset"
dynamic = ["version"]
readme = "README.md"
license = "GPL-3.0"
license-files = ["LICENSE"]
authors = [
    { name="RedRem", email="alex@gameofpods.de"}
]
classifiers = [
    'Development Status :: 2 - Pre-Alpha',
    'Intended Audience :: Developers',
    'Natural Language :: English',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.12',
]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4",
    "deepmultilingualpunctuation",
    "ebooklib",
    "faster-whisper",
    "gliner",
    "gliner2",
    "huggingface-hub>=0.24",
    "langchain",
    "langchain-classic",
    "langchain-core",
    "langchain-openai",
    "langchain-text-splitters",
    "langdetect>=1.0.9",
    "linkify-it-py",
    "markdown",
    "markdown-it-py",
    "mdformat",
    "mdutils",
    "nemo-toolkit[asr]>=2",
    "numpy<2",
    "nvidia-cudnn-cu12",
    "nvidia-pyindex",
    "pip",
    "psutil",
    "pyannote-audio",
    "pydantic",
    "pydub",
    "python-levenshtein",
    "pyyaml",
    "reportlab",
    "requests",
    "roman",
    "rttm-manager",
    "scikit-learn",
    "scipy",
    "spacy",
    "spacy-download",
    "spacy-transformers",
    "speechbrain",
    "tiktoken",
    "torch>=2.5,<2.6",
    "torchaudio<2.9",
    "torchvision",
    "tqdm",
    "whisperx",
    "xlsxwriter",
]
[dependency-groups]
dev = [
    "pandas-stubs>=2.3.3.251219",
    "pytest>=9.1.1",
]

[project.urls]
Homepage = "https://github.com/GameOfPods/MAT"
"Bug Tracker"= "https://github.com/GameOfPods/MAT/issues"

[project.scripts]
MAT = "MAT.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [
    ".idea*",
]

[tool.hatch.version]
path = "MAT/__version__.py"

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
nvidia-cudnn-cu12 = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.uv.extra-build-dependencies]
nvidia-pyindex = ["pip"]
youtokentome = ["Cython", "setuptools", "wheel"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.4"
explicit = true

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
