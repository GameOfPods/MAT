[project]
name = "MAT"
description = "Media Analytics Toolset"
dynamic = ["version"]
readme = "README.md"
license = "GPL-3.0"
license-files = ["LICENSE"]
authors = [
    { name="RedRem", email="alex@gameofpods.de"}
]
classifiers = [
    'Development Status :: 2 - Pre-Alpha',
    'Intended Audience :: Developers',
    'Natural Language :: English',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.12',
]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "deepmultilingualpunctuation>=1.0.1",
    "ebooklib>=0.20",
    "faster-whisper>=1.1.0",
    "gliner>=0.2.22",
    "gliner2>=1.2.3",
    "huggingface-hub>=0.36.0",
    "langchain>=1.2.1",
    "langchain-classic>=1.0.1",
    "langchain-openai>=1.1.6",
    "langdetect>=1.0.9",
    "linkify-it-py>=2.0.3",
    "markdown>=3.10",
    "markdown-it-py>=4.0.0",
    "mdformat>=1.0.0",
    "mdutils>=1.8.1",
    "nemo-toolkit[asr]>=2.2.1",
    "numpy>=1.26.4",
    "nvidia-cudnn-cu12>=9.10.2.21",
    "nvidia-pyindex>=1.0.9",
    "pip>=25.3",
    "psutil>=7.2.1",
    "pyannote-audio>=3.3.2",
    "pydantic>=2.12.5",
    "pydub>=0.25.1",
    "python-levenshtein>=0.27.3",
    "pyyaml>=6.0.3",
    "reportlab>=4.4.7",
    "requests>=2.32.5",
    "roman>=5.2",
    "rttm-manager>=0.1.8",
    "scikit-learn>=1.8.0",
    "scipy>=1.16.3",
    "spacy>=3.7.5",
    "spacy-download>=1.1.0",
    "spacy-transformers>=1.3.9",
    "speechbrain>=1.0.3",
    "tiktoken>=0.12.0",
    "torch>=2.9.1",
    "torchaudio>=2.9.1",
    "torchvision>=0.24.1",
    "tqdm>=4.67.1",
    "whisperx>=3.3.1",
    "xlsxwriter>=3.2.9",
]
[dependency-groups]
dev = [
    "pandas-stubs>=2.3.3.251219",
]

[project.urls]
Homepage = "https://github.com/GameOfPods/MAT"
"Bug Tracker"= "https://github.com/GameOfPods/MAT/issues"

[project.scripts]
MAT = "MAT.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [
    ".idea*",
]

[tool.hatch.version]
path = "MAT/__version__.py"

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
nvidia-cudnn-cu12 = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.uv.extra-build-dependencies]
nvidia-pyindex = ["pip"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.4"
explicit = true

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true
