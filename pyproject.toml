[project]
name = "MAT"
description = "Media Analytics Toolset"
dynamic = ["version"]
readme = "README.md"
license = "GPL-3.0"
license-files = ["LICENSE"]
authors = [
    { name="RedRem", email="alex@gameofpods.de"}
]
classifiers = [
    'Development Status :: 2 - Pre-Alpha',
    'Intended Audience :: Developers',
    'Natural Language :: English',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.12',
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "beautifulsoup4",
    "deepmultilingualpunctuation",
    "ebooklib",
    "faster-whisper>=1.2",
    "gliner",
    # 2.0 moved torch/transformers/peft into the "local" extra
    "gliner2[local]>=2",
    "huggingface-hub",
    "langchain>=1",
    "langchain-classic>=1",
    "langchain-core>=1",
    "langchain-openai>=1",
    "langchain-text-splitters>=1",
    "langdetect>=1.0.9",
    "linkify-it-py",
    "markdown",
    "markdown-it-py",
    "mdformat",
    "mdutils",
    "nemo-toolkit[asr]>=3",
    "numpy>=2",
    "pip",
    "psutil",
    "pyannote-audio>=4",
    "pydantic",
    "pydub",
    "python-levenshtein",
    "pyyaml",
    "reportlab",
    "requests",
    "roman",
    "rttm-manager",
    "scikit-learn",
    "scipy",
    "spacy",
    "spacy-download",
    "spacy-transformers",
    "speechbrain",
    "tiktoken",
    # 2.15 stops publishing CUDA 12.6 wheels, the last ones with Pascal (GTX 10xx) kernels
    "torch>=2.8,<2.15",
    "torchaudio>=2.8,<2.15",
    # torchcodec releases are tied to one torch version: 0.7 <-> 2.8, 0.8 <-> 2.9, ...
    # Move this together with torch, otherwise pyannote fails to decode audio at runtime
    "torchcodec>=0.7,<0.8",
    "torchvision",
    "tqdm",
    "whisperx>=3.8",
    "xlsxwriter",
]

[dependency-groups]
dev = [
    "pandas-stubs>=2.3.3.251219",
    "pytest>=9.1.1",
]
# Torch build. cu126 is the default and also runs on CPU.
# CPU-only machines can use the smaller build: uv sync --no-default-groups --group dev --group cpu
cu126 = [
    "torch>=2.8,<2.15",
    "torchaudio>=2.8,<2.15",
    "torchvision",
]
cpu = [
    "torch>=2.8,<2.15",
    "torchaudio>=2.8,<2.15",
    "torchvision",
]

[project.urls]
Homepage = "https://github.com/GameOfPods/MAT"
"Bug Tracker"= "https://github.com/GameOfPods/MAT/issues"

[project.scripts]
MAT = "MAT.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [
    ".idea*",
]

[tool.hatch.version]
path = "MAT/__version__.py"

[tool.uv]
# uv has no default extras, so the torch build is picked with groups.
# Without a default, a plain `uv run` would install the PyPI build, which doesn't run on GTX 10xx cards.
default-groups = ["dev", "cu126"]
conflicts = [
    [
        { group = "cpu" },
        { group = "cu126" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu126", group = "cu126" },
]
torchaudio = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu126", group = "cu126" },
]
torchvision = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu126", group = "cu126" },
]

[tool.uv.extra-build-dependencies]
youtokentome = ["Cython", "setuptools", "wheel"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# CUDA 12.6 is the newest PyTorch build that still runs on Pascal cards like the GTX 1080 Ti
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
