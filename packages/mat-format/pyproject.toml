[project]
name = "mat-format"
# the major version follows the result format version
version = "2.1.0"
description = "Data model, JSON schemas and reader for MAT (Media Analytics Toolset) results"
readme = "README.md"
# Apache 2.0, unlike the rest of MAT (GPL-3.0), so programs under any license can use the reader and the schemas
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name="RedRem", email="alex@gameofpods.de"}
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
]

[project.urls]
Homepage = "https://github.com/GameOfPods/MAT"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mat_format"]
